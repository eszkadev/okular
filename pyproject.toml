[tool.poetry]
name = "okular"
version = "1.0.0"
description = "Parser and quick preview for Jenkins jobs logs"
authors = ["Szymon Kłos <eszkadev@gmail.com>"]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.13"
flask = "^3.1"
gunicorn = ">=23"
jenkinsapi = "^0.3.13"
requests = "^2.32.4"
pytest = "^7.3.0"
sqlalchemy = "^2.0.36"
flask-sqlalchemy = "^3.1"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
